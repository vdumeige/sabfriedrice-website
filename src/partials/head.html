<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{site.url}}/{{path}}" />

<!-- Open Graph / social -->
<meta property="og:type" content="{{#is path ''}}website{{else}}article{{/is}}" />
<meta property="og:site_name" content="{{site.name}}" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:url" content="{{site.url}}/{{path}}" />
<meta property="og:image" content="{{site.url}}/assets/img/{{#if ogImage}}{{ogImage}}{{else}}card/sab-sampler-960.webp{{/if}}" />
<meta property="og:locale" content="en_US" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{title}}" />
<meta name="twitter:description" content="{{description}}" />
<meta name="twitter:image" content="{{site.url}}/assets/img/{{#if ogImage}}{{ogImage}}{{else}}card/sab-sampler-960.webp{{/if}}" />

<meta name="theme-color" content="#1a1512" />

<!-- Favicon -->
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png" />
<link rel="manifest" href="/assets/favicon/manifest.json" />
<link rel="mask-icon" href="/assets/favicon/safari-pinned-tab.svg" color="#f5a637" />
<link rel="shortcut icon" href="/assets/favicon/favicon.ico" />

<!-- Fonts. The old build preconnected only to fonts.gstatic.com without
     crossorigin, which matches no real request and saved nothing. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600..900,0..100,0..1&family=Lato:wght@400;700;900&display=swap"
/>

<link rel="stylesheet" href="/assets/css/theme.bundle.css?v={{themeVersion}}" />

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RNG7PJLT9T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RNG7PJLT9T');
</script>

<!-- Structured data. openingHoursSpecification is where Google reads the
     Tuesday closure from; keep it in step with site.json. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "@id": "{{site.url}}/#restaurant",
  "name": "{{site.name}}",
  "description": "{{description}}",
  "servesCuisine": ["Thai", "Lao"],
  "url": "{{site.url}}/",
  "telephone": "{{site.phoneSchema}}",
  "priceRange": "$$",
  "image": "{{site.url}}/assets/img/card/sab-sampler-960.webp",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{site.street}}",
    "addressLocality": "{{site.city}}",
    "addressRegion": "{{site.region}}",
    "postalCode": "{{site.postalCode}}",
    "addressCountry": "US"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": {{site.latitude}},
    "longitude": {{site.longitude}}
  },
  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
      "opens": "{{site.opensTime}}",
      "closes": "{{site.closesTime}}"
    },
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": "Tuesday",
      "opens": "00:00",
      "closes": "00:00"
    }
  ],
  "hasMenu": "{{site.url}}/menu.html",
  "acceptsReservations": "False",
  "sameAs": ["{{site.yelp}}", "{{site.instagram}}"]
}
</script>
